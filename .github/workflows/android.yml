name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the debug-latest pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (forecast engine)
        run: ./gradlew :core:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  # Stable download link for the phone: the latest debug APK on a "debug-latest" pre-release.
  # Its own job in one concurrency group, so two pushes never replace the release at the same time.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: debug-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-debug.apk wt-tracker-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest wt-tracker-debug.apk screenshots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android (allow installs from this source). Estimates, not medical advice."
