name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the debug-latest pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Read versionName
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Core tests (forecast engine)
        run: ./gradlew :core:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  # Stable download link for the phone: the latest debug APK on a "debug-latest" pre-release.
  # On main, a new versionName also gets its own tagged release (v0.2.0, ...), created once.
  # Its own job in one concurrency group, so two pushes never replace the release at the same time.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: debug-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp apk/app-debug.apk wt-tracker-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest wt-tracker-debug.apk screenshots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK v${VERSION} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android (allow installs from this source). Estimates, not medical advice."

      - name: Publish tagged release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; bump versionName in app/build.gradle.kts for a new one."
            exit 0
          fi
          cp apk/app-debug.apk "wt-tracker-${tag}.apk"
          gh release create "$tag" "wt-tracker-${tag}.apk" --target "$GITHUB_SHA" \
            --title "Wt-tracker ${tag}" \
            --notes "Wt-tracker ${tag} from main @ ${GITHUB_SHA::7} (debug-signed, installs over earlier builds and keeps data). Estimates, not medical advice."
