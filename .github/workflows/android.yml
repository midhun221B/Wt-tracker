name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the debug-latest pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Read versionName
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Core tests (forecast engine)
        run: ./gradlew :core:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  # Smoke test on an Android 14 emulator (Pixel 6 profile, 411 dp wide like the owner's phone): update from the
  # latest release keeps the data, every tab and Settings open, no crash (.github/emulator/smoke.py).
  # Its screenshots go to an "emulator-latest" pre-release, which a cloud session can download.
  emulator:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: emulator-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk

      - name: Latest release to update from
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download --pattern 'wt-tracker-v*.apk' --output old.apk # no tag: the latest non-pre-release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/emulator/smoke.py apk/app-debug.apk old.apk emulator-shots

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator-shots/

      - name: Publish emulator screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls emulator-shots/*.png > /dev/null 2>&1 || exit 0
          gh release delete emulator-latest --yes --cleanup-tag || true
          gh release create emulator-latest emulator-shots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Emulator screenshots (latest)" \
            --notes "Android 14 emulator (Pixel 6 profile) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, job ${{ job.status }}."

  # Stable download link for the phone: the latest debug APK on a "debug-latest" pre-release.
  # On main, a new versionName also gets its own tagged release (v0.2.0, ...), created once.
  # Its own job in one concurrency group, so two pushes never replace the release at the same time.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: debug-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Publish debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cp apk/app-debug.apk wt-tracker-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest wt-tracker-debug.apk screenshots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK v${VERSION} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android (allow installs from this source). Estimates, not medical advice."

      - name: Publish tagged release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; bump versionName in app/build.gradle.kts for a new one."
            exit 0
          fi
          cp apk/app-debug.apk "wt-tracker-${tag}.apk"
          gh release create "$tag" "wt-tracker-${tag}.apk" --target "$GITHUB_SHA" \
            --title "Wt-tracker ${tag}" \
            --notes "Wt-tracker ${tag} from main @ ${GITHUB_SHA::7} (debug-signed, installs over earlier builds and keeps data). Estimates, not medical advice."
