name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to commit screenshot previews

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (forecast engine)
        run: ./gradlew :core:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      # Keep small previews in the repo so the screens can be viewed on GitHub directly.
      - name: Commit screenshot previews
        if: github.event_name == 'push' && success()
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/preview/*.jpg docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshot previews [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
