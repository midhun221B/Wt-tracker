name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the debug-latest pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.key.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset).
      - uses: gradle/actions/setup-gradle@v4

      - name: Read versionName
        id: version
        run: echo "name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Core tests (forecast engine)
        run: ./gradlew :core:test --console=plain

      - name: App unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      # The release APK is signed with the private key from the repository secrets (docs/RELEASING.md). Without the
      # secrets (a fork's pull request, or before they exist) a throwaway key still proves the release build works,
      # but that APK is never published.
      - name: Release signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          file="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$file"
            echo "kind=real" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PASSWORD=throwaway-password; KEY_ALIAS=throwaway; KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$file" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 2 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=throwaway"
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "RELEASE_KEYSTORE_FILE=$file"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Check the release signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Verifies|Signer #1 certificate (DN|SHA-256)"

      - name: Upload release APK
        if: steps.key.outputs.kind == 'real'
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  # Smoke test on an Android 14 emulator (Pixel 6 profile, 411 dp wide like the owner's phone): update from the
  # latest release keeps the data, every tab and Settings open, no crash (.github/emulator/smoke.py).
  # Its screenshots go to an "emulator-latest" pre-release, which a cloud session can download.
  emulator:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: emulator-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk

      # Pinned to the last debug-signed release: the test build is debug-signed too, so it installs over it. (Later
      # releases carry the private release key and can't be updated by a debug build.)
      - name: Release to update from
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v0.8.1 --pattern 'wt-tracker-v*.apk' --output old.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Follow mode in the smoke test reads the share fixture from the host (10.0.2.2:8765 inside the emulator).
      - name: Serve the follow-mode test file
        run: nohup python3 -m http.server 8765 --directory core/src/test/resources > /dev/null 2>&1 &

      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/emulator/smoke.py apk/app-debug.apk old.apk emulator-shots

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator-shots/

      - name: Publish emulator screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls emulator-shots/*.png > /dev/null 2>&1 || exit 0
          gh release delete emulator-latest --yes --cleanup-tag || true
          gh release create emulator-latest emulator-shots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Emulator screenshots (latest)" \
            --notes "Android 14 emulator (Pixel 6 profile) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, job ${{ job.status }}."

  # Stable download link for the phone: the latest debug APK on a "debug-latest" pre-release.
  # On main, a new versionName also gets its own tagged release (v0.2.0, ...), created once.
  # Its own job in one concurrency group, so two pushes never replace the release at the same time.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: debug-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wt-tracker-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - uses: actions/download-artifact@v4
        if: needs.build.outputs.signed == 'real'
        with:
          name: wt-tracker-release-apk
          path: release

      # With the release key set up, the phone link serves the release-signed build (so it installs over store
      # releases); until then it serves the debug-signed one.
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -f release/app-release.apk ]; then cp release/app-release.apk wt-tracker-debug.apk; else cp apk/app-debug.apk wt-tracker-debug.apk; fi
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest wt-tracker-debug.apk screenshots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK v${VERSION} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android (allow installs from this source). Estimates, not medical advice."

      - name: Publish tagged release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released; bump versionName in app/build.gradle.kts for a new one."
            exit 0
          fi
          if [ ! -f release/app-release.apk ]; then
            echo "::warning::No release signing key in the repository secrets: $tag was not published. See docs/RELEASING.md."
            exit 0
          fi
          cp release/app-release.apk "wt-tracker-${tag}.apk"
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          log="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          { [ -f "$log" ] && cat "$log"; echo; echo "Downhill ${tag} from main @ ${GITHUB_SHA::7}, signed with the Downhill release key. Estimates, not medical advice."; } > notes.txt
          gh release create "$tag" "wt-tracker-${tag}.apk" --target "$GITHUB_SHA" --title "Downhill ${tag}" --notes-file notes.txt
